packages:
  - 'apps/*'
overrides:
  postcss: '>=8.5.23'
  '@hono/node-server@<2.1.6': '^2.1.6'
  'hono@<4.13.16': '^4.13.16'
  'fast-uri@<3.1.9': '^3.1.9'
  mysql2: '3.23.1'
  'qs@<6.16.1': '^6.16.1'
  nanoid: '3.3.18'
  browserslist: '4.28.7'
  valibot: '1.4.2'
  deepmerge-ts: '8.0.0'
  'sharp@<0.35.5': '^0.35.5'
  'multer@<2.5.0': '^2.5.0'
  'proxy-addr@<2.0.8': '^2.0.8'
  'body-parser@<2.4.0': '^2.4.0'
  'follow-redirects@<1.16.2': '^1.16.2'
  'source-map-js@<1.2.2': '^1.2.2'
  'zod@>=4 <4.6.6': '^4.6.6'
allowBuilds:
  '@nestjs/core': false
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: false
minimumReleaseAgeExclude:
  - hono@4.12.34
  - fast-uri@3.1.6
  - sharp@0.35.0
  - '@hono/node-server@2.0.10'
# Temporary: these better-auth advisories are only fixed in 1.7.x, which requires
# an AuthAccount schema migration (tracked in a dedicated upgrade PR).
# None is reachable here: the app only uses email/password and the admin plugin.
# Remove this list once better-auth >= 1.7.7 is installed.
auditConfig:
  ignoreGhsas:
    - GHSA-965c-763c-88jm # critical: OAuth state reused as magic link
    - GHSA-r4xp-prcw-77qf # high: oauth-proxy plugin sign-in as another user
    - GHSA-q84f-53jg-9ppm # high: device-authorization approval screen